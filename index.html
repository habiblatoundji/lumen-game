<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none; }
  #jeu { width: 100%; height: 100%; }
  #tourne { display: none; position: fixed; inset: 0; z-index: 10; background: #05060d; color: #9fb0ff;
            font: 20px sans-serif; align-items: center; justify-content: center; text-align: center; }
  @media (orientation: portrait) { #tourne { display: flex; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="jeu"></div>
<div id="tourne">Tourne ton téléphone<br>en mode paysage</div>
<script>
const LARGEUR = 800;
const HAUTEUR = 360;
const COULEUR_ENNEMI = 0x8a3b5c;

class Jeu extends Phaser.Scene {
  constructor() { super('Jeu'); }

  create() {
    this.input.addPointer(2);
    this.gauche = false;
    this.droite = false;
    this.demandeSaut = false;
    this.demandeAttaque = false;
    this.sens = 1;                 // 1 = regarde à droite, -1 = à gauche
    this.prochaineAttaque = 0;
    this.ennemis = [];
    this.listePlateformes = [];
    this.vaincus = 0;

    // Particules de fond
    for (let i = 0; i < 40; i++) {
      const p = this.add.circle(
        Phaser.Math.Between(0, LARGEUR), Phaser.Math.Between(0, HAUTEUR),
        Phaser.Math.Between(1, 2), 0x9fb0ff, Phaser.Math.FloatBetween(0.15, 0.5));
      this.tweens.add({
        targets: p, y: p.y - Phaser.Math.Between(40, 120), alpha: 0.05,
        duration: Phaser.Math.Between(2500, 5000), yoyo: true, repeat: -1, ease: 'Sine.inOut'
      });
    }

    // Joueur : une petite lumière
    this.halo = this.add.circle(100, 250, 34, 0xffd27a, 0.18);
    this.tweens.add({ targets: this.halo, scale: 1.3, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    this.joueur = this.add.circle(100, 250, 14, 0xffe9a8);
    this.oeil = this.add.circle(106, 248, 3, 0x080a18);
    this.physics.add.existing(this.joueur);
    this.joueur.body.setCollideWorldBounds(true);

    // Sol et plateformes
    this.creerPlateforme(LARGEUR / 2, HAUTEUR - 20, LARGEUR, 40);
    this.creerPlateforme(300, 270, 160, 16);
    this.creerPlateforme(500, 200, 160, 16);
    this.creerPlateforme(700, 130, 160, 16);

    // Premier ennemi : un mannequin d'entraînement
    this.creerEnnemi(420, 300);

    // Commandes tactiles
    this.bouton(60, 300, '◀', () => { this.gauche = true; }, () => { this.gauche = false; });
    this.bouton(150, 300, '▶', () => { this.droite = true; }, () => { this.droite = false; });
    this.bouton(740, 300, '▲', () => { this.demandeSaut = true; }, () => {});
    this.bouton(655, 300, '●', () => { this.demandeAttaque = true; }, () => {});

    // Clavier (pour tester sur ordinateur) : flèches, espace = saut, X = attaque
    this.clavier = this.input.keyboard.createCursorKeys();
    this.espace = this.input.keyboard.addKey('SPACE');
    this.toucheAttaque = this.input.keyboard.addKey('X');

    this.add.text(16, 12, 'LUMEN - test 2 : attaque', { fontFamily: 'sans-serif', fontSize: '16px', color: '#8fa0ff' });
    this.texteScore = this.add.text(LARGEUR - 16, 12, 'Vaincus : 0',
      { fontFamily: 'sans-serif', fontSize: '16px', color: '#ff9ac4' }).setOrigin(1, 0);
  }

  creerPlateforme(x, y, largeur, hauteur) {
    const plateforme = this.add.rectangle(x, y, largeur, hauteur, 0x1a1f3a);
    plateforme.setStrokeStyle(2, 0x4a5aa8);
    this.physics.add.existing(plateforme, true);
    this.physics.add.collider(this.joueur, plateforme);
    this.listePlateformes.push(plateforme);
    return plateforme;
  }

  creerEnnemi(x, y) {
    const ennemi = this.add.rectangle(x, y, 26, 36, COULEUR_ENNEMI);
    ennemi.setStrokeStyle(2, 0xff7ab0);
    this.physics.add.existing(ennemi);
    ennemi.body.setDragX(500);
    ennemi.body.setCollideWorldBounds(true);
    ennemi.pv = 3;
    ennemi.colliders = this.listePlateformes.map((p) => this.physics.add.collider(ennemi, p));
    this.ennemis.push(ennemi);
    return ennemi;
  }

  bouton(x, y, texte, quandAppuye, quandRelache) {
    const rayon = 34;
    const cercle = this.add.circle(x, y, rayon, 0xffffff, 0.12).setStrokeStyle(2, 0xffffff, 0.35);
    cercle.setInteractive(new Phaser.Geom.Circle(rayon, rayon, rayon + 10), Phaser.Geom.Circle.Contains);
    this.add.text(x, y, texte, { fontSize: '28px', color: '#ffffff' }).setOrigin(0.5).setAlpha(0.8);
    cercle.on('pointerdown', quandAppuye);
    cercle.on('pointerup', quandRelache);
    cercle.on('pointerout', quandRelache);
  }

  attaquer() {
    if (this.time.now < this.prochaineAttaque) return;
    this.prochaineAttaque = this.time.now + 350;

    const x = this.joueur.x + this.sens * 34;
    const y = this.joueur.y;
    const zone = new Phaser.Geom.Rectangle(x - 26, y - 22, 52, 44);

    // Trait lumineux de l'attaque
    const trace = this.add.rectangle(x, y, 52, 10, 0xffffff, 0.8).setScale(0.4, 1);
    this.tweens.add({
      targets: trace, alpha: 0, scaleX: 1.1, scaleY: 3, duration: 160,
      onComplete: () => trace.destroy()
    });

    [...this.ennemis].forEach((ennemi) => {
      if (Phaser.Geom.Intersects.RectangleToRectangle(zone, ennemi.getBounds())) this.toucher(ennemi);
    });
  }

  toucher(ennemi) {
    ennemi.pv -= 1;
    ennemi.setFillStyle(0xffffff);
    this.time.delayedCall(90, () => { if (ennemi.active) ennemi.setFillStyle(COULEUR_ENNEMI); });
    ennemi.body.setVelocityX(this.sens * 260);
    ennemi.body.setVelocityY(-120);
    this.cameras.main.shake(90, 0.004);
    if (ennemi.pv <= 0) this.mourir(ennemi);
  }

  mourir(ennemi) {
    const x = ennemi.x;
    const y = ennemi.y;
    for (let i = 0; i < 12; i++) {
      const eclat = this.add.circle(x, y, Phaser.Math.Between(2, 4), 0xff7ab0);
      this.tweens.add({
        targets: eclat,
        x: x + Phaser.Math.Between(-60, 60),
        y: y + Phaser.Math.Between(-60, 20),
        alpha: 0, duration: 450,
        onComplete: () => eclat.destroy()
      });
    }
    ennemi.colliders.forEach((c) => this.physics.world.removeCollider(c));
    this.ennemis = this.ennemis.filter((e) => e !== ennemi);
    ennemi.destroy();

    this.vaincus += 1;
    this.texteScore.setText('Vaincus : ' + this.vaincus);
    this.time.delayedCall(2000, () => this.creerEnnemi(420, 300));
  }

  update() {
    const corps = this.joueur.body;
    const allerGauche = this.gauche || this.clavier.left.isDown;
    const allerDroite = this.droite || this.clavier.right.isDown;
    if (allerGauche) this.sens = -1;
    else if (allerDroite) this.sens = 1;
    corps.setVelocityX(allerGauche ? -200 : allerDroite ? 200 : 0);

    const auSol = corps.blocked.down || corps.touching.down;
    const saut = this.demandeSaut
      || Phaser.Input.Keyboard.JustDown(this.clavier.up)
      || Phaser.Input.Keyboard.JustDown(this.espace);
    if (saut && auSol) corps.setVelocityY(-430);
    this.demandeSaut = false;

    if (this.demandeAttaque || Phaser.Input.Keyboard.JustDown(this.toucheAttaque)) this.attaquer();
    this.demandeAttaque = false;

    this.halo.setPosition(this.joueur.x, this.joueur.y);
    this.oeil.setPosition(this.joueur.x + this.sens * 6, this.joueur.y - 2);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'jeu',
  width: LARGEUR,
  height: HAUTEUR,
  backgroundColor: '#080a18',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 900 } } },
  scene: Jeu
});
</script>
</body>
</html>
