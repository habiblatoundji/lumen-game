<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none; }
  #jeu { width: 100%; height: 100%; }
  #tourne { display: none; position: fixed; inset: 0; z-index: 10; background: #05060d; color: #9fb0ff;
            font: 20px sans-serif; align-items: center; justify-content: center; text-align: center; }
  @media (orientation: portrait) { #tourne { display: flex; } }
  #erreur { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 8px;
            background: rgba(140, 0, 0, 0.9); color: #fff; font: 12px monospace; white-space: pre-wrap; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="jeu"></div>
<div id="tourne">Tourne ton téléphone<br>en mode paysage</div>
<div id="erreur"></div>
<script>
// Liste des fichiers du jeu, chargés dans cet ordre.
// Pour ajouter une fonction au jeu : créer un fichier dans src/ puis ajouter son nom ici.
const FICHIERS = [
  'src/config.js',
  'src/niveaux.js',
  'src/commandes.js',
  'src/joueur.js',
  'src/ennemi.js',
  'src/scene-jeu.js',
  'src/main.js'
];

// Affiche les erreurs à l'écran (utile pour déboguer sur téléphone)
function afficherErreur(texte) {
  const zone = document.getElementById('erreur');
  zone.style.display = 'block';
  zone.textContent += texte + '\n';
}
window.addEventListener('error', (e) => {
  afficherErreur('Erreur : ' + e.message + ' (' + String(e.filename).split('/').pop().split('?')[0] + ':' + e.lineno + ')');
});

// Le paramètre ?t=... force le navigateur à recharger les fichiers à chaque visite
FICHIERS.forEach((fichier) => {
  const script = document.createElement('script');
  script.src = fichier + '?t=' + Date.now();
  script.async = false;
  script.onerror = () => afficherErreur('Fichier introuvable : ' + fichier);
  document.body.appendChild(script);
});
</script>
</body>
</html>
